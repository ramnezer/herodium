# ==============================================================================
# Herodium Security System - Configuration File
# ==============================================================================

system:
  run_as_user: "root"
  log_file: "/var/log/herodium/herodium.log"
  log_level: "INFO"

  # Controls notifications
notifications:
  enable: true

live_monitor:
  # Controls real-time monitoring modules (FS watcher + USB + Memory Hunter loop)
  enable: true

directories:
  # Critical monitoring paths (avoid "/" to prevent inotify crashes)
  watch_paths:
    - "/home"
    - "/tmp"
    - "/etc"
    - "/var/www"

  quarantine_dir: "/opt/herodium/quarantine"

  # Optional performance filters for live scanning
  ignore_prefixes:
    - "/proc"
    - "/sys"
    - "/dev"
    - "/run"
    - "/var/log"
    - "/var/lib/clamav"
    - "/opt/herodium/quarantine"
    - "/snap"
    - "/root/.maltrail"

  # Optional: ignore /home/*/.cache and /root/.cache to improve performance
  ignore_user_cache: false

  # Bound live filesystem scan backlog and in-memory dedup state.
  scan_queue_max_size: 1024

  # Rate-limit queue pressure warnings during large filesystem bursts.
  scan_queue_warning_interval_seconds: 30

  # Coalesce dropped live events into bounded root-level catch-up scans.
  scan_recovery_enable: true
  scan_recovery_max_roots: 8
  scan_recovery_queue_low_watermark_percent: 25
  scan_recovery_max_files_per_pass: 2048
  scan_recovery_max_total_files_per_root: 250000
  scan_recovery_max_seconds_per_pass: 5
  scan_recovery_max_depth: 64

  # Aggregate transient directory changes during removable-media recovery.
  scan_recovery_directory_warning_interval_seconds: 30

clamav:
  socket_path: "/var/run/clamav/clamd.ctl"

  # Keep clamd extraction/normalization files outside live-monitored paths.
  temporary_directory: "/var/lib/clamav/herodium-tmp"
  max_file_size_mb: 25
  stream_max_length_mb: 25
  threat_action: "quarantine"

# Memory Scan Configuration
memory_scan:
  interval_seconds: 1
  # If false, Memory Hunter will alert/log detections but will not terminate processes.
  # Also forced off automatically when clamav.threat_action is "alert".
  kill_infected_process: true
  whitelist:
    - "chrome"
    - "firefox"
    - "code"
    - "gnome-shell"
    - "systemd"

maltrail:
  enable: false
  log_path: "/var/log/maltrail/detected.log"
  block_traffic: false
  harden_ufw: false
  ipset_name: "herodium_blacklist"
  # --- Anti-Trolling Whitelist ---
  whitelist:
    - "127.0.0.1"        # Localhost
    - "::1"              # IPv6 Localhost
    - "192.168.1.1"      # Router/Gateway (Example)
    - "8.8.8.8"          # DNS (Prevent internet cutoff)
  ping_before_block: false
  desktop_notifications: true
  desktop_log: true

  # Coalesce repeated identical IOC alerts to prevent desktop/log flooding.
  alert_cooldown_seconds: 300
  alert_cache_max_entries: 1024

  # Cache positive and negative DNS lookups so repeated NXDOMAIN events do
  # not delay later blockable IP events in the single Maltrail log consumer.
  dns_resolution_cache_seconds: 300
  dns_resolution_cache_max_entries: 1024

  clean_interval_hours: 168

performance:
  # If false, ZRAM won't be enabled by the engine (respects user choice from installer)
  enable_zram: false
  cpu_limit_percent: 30

hardening:
  enable: false
  rules:
    "net.ipv4.conf.all.rp_filter": "1"
    "net.ipv4.conf.all.accept_redirects": "0"
    "net.ipv4.conf.default.accept_redirects": "0"
    "net.ipv4.icmp_echo_ignore_broadcasts": "1"
    "net.ipv4.tcp_syncookies": "1"
    "net.ipv4.conf.all.log_martians": "1"
    "kernel.dmesg_restrict": "1"
    "kernel.kptr_restrict": "1"

scheduler:
  enable: true
  rkhunter_interval_hours: 6
  home_scan_interval_hours: 24
  full_scan_interval_hours: 168
  update_interval_hours: 24

ips:
  enable: false
  bantime: 3600
  maxretry: 3
  findtime: 60

apparmor:
  # Security Levels:
  # 1 = Default (OS Defaults, no Herodium AppArmor changes)
  # 2 = Light/Test (Complain Mode - logs only; may reduce existing enforcement)
  # 3 = Medium (Install basic profiles in Enforce Mode - Blocks known threats)
  # 4 = Full (Extended profiles + Auditd + Full Enforcement - Highest security, may break apps)
  level: 1

  # Create a Timeshift backup before changing profile levels (Highly recommended for levels 2-4)
  create_backup: true
  backup_name: "herodium_pre_apparmor_change"
